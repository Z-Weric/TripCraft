services:
  mysql:
    image: mysql:8.0.32
    container_name: tripcraft-mysql
    restart: unless-stopped
    env_file:
      - ./docker/.env
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tripcraft_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - tripcraft

  redis:
    image: redis/redis-stack:7.2.0-v18
    container_name: tripcraft-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tripcraft_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tripcraft

volumes:
  tripcraft_mysql_data:
  tripcraft_redis_data:

networks:
  tripcraft:
    name: tripcraft

